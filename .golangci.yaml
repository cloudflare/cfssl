version: "2"

linters:
  default: none
  enable:
    - govet
  exclusions:
    paths:
      # Fork of an old crypto/tls; test.sh skips it too.
      - scan/crypto
    rules:
      # The stray comma in the Name.OID struct tag hides its yaml key, so YAML
      # libraries use their default key. Fixing it would change YAML behavior.
      - path: csr/csr\.go
        linters:
          - govet
        text: structtag
